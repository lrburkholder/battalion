[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battalion"
version = "1.0.0"
description = "LangGraph-based SDLC orchestrator with human-controlled interrupt points"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["battalion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
