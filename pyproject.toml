[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battalion"
version = "0.1.0"
description = "LangGraph-based SDLC orchestrator with human-controlled interrupt points"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
    "langgraph>=1.2,<2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6==6.10.1",
    "Nuitka==4.1.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
battalion = "battalion.cli:main"
battalion-desktop = "battalion.desktop.app:main"

[tool.setuptools.packages.find]
include = ["battalion*"]

[tool.setuptools.package-data]
"battalion.desktop" = ["assets/*", "assets/fonts/*"]
"battalion.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
