[project]
name = "battalion"
version = "0.1.0"
description = "LangGraph-based SDLC orchestrator with human-controlled interrupt points"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
