<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Battalion Tauri Benchmark</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <p class="eyebrow">Disposable framework spike · BTN-38</p>
      <h1>Battalion operator benchmark</h1>
      <p id="status" role="status" aria-live="polite">Loading shared fixture…</p>
    </header>
    <main>
      <section aria-labelledby="scenario-title">
        <h2 id="scenario-title">Shared scenario</h2>
        <ol id="steps"></ol>
      </section>
      <section aria-labelledby="trace-title">
        <h2 id="trace-title">Acceptance trace</h2>
        <pre id="trace" tabindex="0"></pre>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
