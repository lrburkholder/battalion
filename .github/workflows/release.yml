name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-and-package-python:
    name: Validate tag and package Python distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out the maintainer-created tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release tag and declared version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py validate-tag --tag "$RELEASE_TAG"
          echo "value=$(python -c 'from scripts.release import package_version; print(package_version())')" >> "$GITHUB_OUTPUT"

      - name: Install deterministic release-gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Run deterministic release gates
        run: python -m pytest tests/ -q --tb=short

      - name: Build Python distribution artifacts
        run: |
          python -m build --sdist --wheel
          python scripts/release.py write-metadata --tag "${{ github.ref_name }}" --revision "$(git rev-parse "${{ github.ref_name }}^{commit}")" --output dist/python-release-metadata.json
          cd dist
          sha256sum battalion-* python-release-metadata.json > battalion-python-SHA256SUMS.txt

      - name: Upload Python release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-distribution
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/python-release-metadata.json
            dist/battalion-python-SHA256SUMS.txt
          if-no-files-found: error

  package-windows-desktop:
    name: Package Windows desktop application
    needs: validate-and-package-python
    runs-on: windows-latest

    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the supported desktop distribution
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python scripts/release.py validate-tag --tag "${{ github.ref_name }}"
          python scripts/build_desktop.py --component all
          $artifact = "dist/battalion-desktop-windows-x64-v${{ needs.validate-and-package-python.outputs.version }}.zip"
          Compress-Archive -Path dist/desktop/* -DestinationPath $artifact
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLower()
          "${hash} *$(Split-Path -Leaf $artifact)" | Set-Content -NoNewline dist/battalion-desktop-windows-x64-SHA256SUMS.txt
          python scripts/release.py write-metadata --tag "${{ github.ref_name }}" --revision "$(git rev-parse "${{ github.ref_name }}^{commit}")" --output dist/desktop-release-metadata.json

      - name: Upload desktop release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-desktop
          path: |
            dist/battalion-desktop-windows-x64-*.zip
            dist/battalion-desktop-windows-x64-SHA256SUMS.txt
            dist/desktop-release-metadata.json
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - validate-and-package-python
      - package-windows-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated Python artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-distribution
          path: release/python-distribution

      - name: Download validated desktop artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-desktop
          path: release/windows-desktop

      - name: Create the GitHub Release from the accepted tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/python-distribution/*.whl \
            release/python-distribution/*.tar.gz \
            release/python-distribution/python-release-metadata.json \
            release/python-distribution/battalion-python-SHA256SUMS.txt \
            release/windows-desktop/* \
            --title "Battalion $RELEASE_TAG" \
            --generate-notes
