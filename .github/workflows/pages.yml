name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - LICENSE
      - spec.md
      - plan.md
      - docs/adrs/**
      - docs/status.md
      - docs/getting-started.md
      - docs/data-handling.md
      - docs/troubleshooting.md
      - docs/contributing.md
      - docs/release.md
      - docs/uat/**
      - docs/ui/**
      - docs/assets/**
      - battalion/desktop/assets/favicon.ico
      - battalion/desktop/assets/mark-transparent.svg
      - scripts/build_pages.py
      - scripts/sync_status.py
      - scripts/capture_pages_screenshots.py
      - .github/pages/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - LICENSE
      - spec.md
      - plan.md
      - docs/adrs/**
      - docs/status.md
      - docs/getting-started.md
      - docs/data-handling.md
      - docs/troubleshooting.md
      - docs/contributing.md
      - docs/release.md
      - docs/uat/**
      - docs/ui/**
      - docs/assets/**
      - battalion/desktop/assets/favicon.ico
      - battalion/desktop/assets/mark-transparent.svg
      - scripts/build_pages.py
      - scripts/sync_status.py
      - scripts/capture_pages_screenshots.py
      - .github/pages/**
      - .github/workflows/pages.yml
  # The lifecycle workflow uses GITHUB_TOKEN to close its validated Issues.
  # That mutation does not itself trigger an issues workflow, so rebuild after
  # the successful lifecycle run to publish the post-merge canonical status.
  workflow_run:
    workflows: [Complete merged Battalion tickets]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Render current project status from canonical GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_status.py

      - name: Stage approved documentation
        run: python scripts/build_pages.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
