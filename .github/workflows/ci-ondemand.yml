name: CI (on-demand)

# Manually triggered, single-Python-version, optionally scoped to a subset of
# tests. Designed to be fired from the `gh` CLI (see scripts/run_ci.sh) so you
# can offload test execution to GitHub's runners instead of running the full
# suite locally on every iteration.
on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Test path, file, or -k marker expression (default: full suite)"
        required: false
        default: "tests/"
      python_version:
        description: "Python version to run against"
        required: false
        default: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Quick test (Python ${{ inputs.python_version }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest ${{ inputs.test_path }} -q --tb=short