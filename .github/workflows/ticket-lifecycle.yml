name: Complete merged Battalion ticket

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ticket-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and close ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The script fetches the current PR body so reruns can recover after a
        # maintainer corrects PR metadata; reruns retain the original event body.
        run: python scripts/complete_merged_ticket.py
